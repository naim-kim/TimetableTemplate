<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Template</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <header>
        <h1>2024 2nd Semester Timetable</h1>
    </header>
    <main>
        <table>
            <thead>
                <tr>
                    <th scope="col" class="time_col">-</th>
                    <th scope="col" class="days">Mon</th>
                    <th scope="col" class="days">Tue</th>
                    <th scope="col" class="days">wed</th>
                    <th scope="col" class="days">Thu</th>
                    <th scope="col" class="days">Fri</th>
                    <th scope="col" class="days">Sat</th>
                    <th scope="col" class="days">Sun</th>
                </tr>
            </thead>
            <tbody id="timetable-body">
                <tr class="period-row">
                    <td>07-08</td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>

                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                </tr>
                <tr class="period-row">
                    <td>10-11</td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                </tr>
                <tr class="period-row">
                    <td>11-12</td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                </tr>
                <tr class="period-row">
                    <td>13-14</td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                </tr>
                <tr class="period-row">
                    <td>14-00</td>

                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                    <td class="editable"></td>
                </tr>
                <tr class="period-row">
                    <td>16-17</td>

                    <td class="editable"></td>

                <tr class="period-row">

                <tr class="period-row">

            </tbody>
        </table>
        <button id="add-row-btn" class="icon-btn"><i class="fas fa-plus"></i><span class="tooltip">Add
                Row</span></button>
        <button id="save-image-btn" class="icon-btn"><i class="fas fa-save"></i><span class="tooltip">Save as
                Image</span></button>
    </main>

    <!-- Modal for Editing Time -->
    <div id="edit-time-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Edit Time</h2>
            <label for="time-input">New Time:</label>
            <input type="text" id="time-input">
            <button id="save-time-btn">Save</button>
        </div>
    </div>

    <!-- Modal for Adding New Subject -->
    <div id="edit-cell-modal" class="modal">
        <div class="modal-content">
            <span class="close-cell-btn">&times;</span>
            <h2>Edit Cell</h2>
            <label for="subject-input">Name:</label>
            <input type="text" id="subject-input">
            <br>
            <label for="place-input">Place:</label>
            <input type="text" id="place-input">
            <br>
            <label for="color-input">Color:</label>
            <input type="color" id="color-input">
            <br>
            <button id="save-cell-btn">Save</button>
            <button id="copy-cell-btn">Copy</button>
        </div>
    </div>


    <script src="scripts.js"></script>
</body>

</html>
